[package]
name = "usb-serial"
version = "0.1.0"
edition = "2024"

[dependencies]
rp235x-hal = { version = "0.4.0", features = ["rt", "critical-section-impl"]}
embedded-hal = "1.0.0"
cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[profile.dev]

[profile.release]
opt-size = "s"
lto = true
codegen-units = 1
strip = true